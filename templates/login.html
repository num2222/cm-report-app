<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ</title>
<style>
  :root { --blue: #1e5aa8; --blue-dark: #123a6e; --border: #e2e6ea; }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Sarabun', Tahoma, sans-serif;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: white; border-radius: 12px; padding: 32px;
    width: 100%; max-width: 360px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  h1 { font-size: 20px; color: var(--blue-dark); margin: 0 0 6px; text-align: center; }
  p.sub { color: #6b7280; font-size: 13px; text-align: center; margin: 0 0 20px; }
  label { font-size: 13px; color: #374151; font-weight: 600; display: block; margin-bottom: 4px; margin-top: 12px; }
  input {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 14px; font-family: inherit;
  }
  .btn {
    width: 100%; background: var(--blue); color: white; border: none;
    padding: 11px; border-radius: 6px; font-size: 15px; font-weight: 600;
    margin-top: 20px; cursor: pointer;
  }
  .btn:hover { background: var(--blue-dark); }
  .flash { background: #fee2e2; color: #991b1b; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; }
  .logo { text-align: center; font-size: 28px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚡</div>
  <h1>เข้าสู่ระบบ</h1>
  <p class="sub">ระบบสต๊อก & PR — งานซ่อมบำรุงระบบไฟฟ้า</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post">
    <label>รหัสผ่าน</label>
    <input type="password" name="password" required autofocus>
    <button class="btn" type="submit">เข้าสู่ระบบ</button>
  </form>
</div>
</body>
</html>
